name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Find affected projects
        uses: nrwl/nx-set-shas@v5

      - name: Enforce aliases
        run: bun run lint:imports

      - name: Verify affected projects
        run: bunx nx affected -t lint,check,test,build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Smoke-test all applications
        run: bun run test:e2e
