<title>Studio Look Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the canvas (a drawing of the studio) takes the width; a quiet control panel sits beside it, under it on a phone. */
:root {
  /* Lab chrome: neutral, system font, clearly not the design under test. */
  --lab-bg: #e9e8e4;
  --lab-fg: #1c1c1a;
  --lab-muted: #5a5954;
  --lab-line: #c4c2bb;
  --lab-field: #f7f7f5;
  --lab-focus: #2456c9;
  --lab-red: #b3261e;

  /* Canvas palette from DESIGN.md, both schemes as fixed tokens. */
  --k-ink-light: #111111;      --k-ink-dark: #ededed;
  --k-white-light: #ffffff;    --k-white-dark: #111111;
  --k-warm-light: #fbf9f4;     --k-warm-dark: #141311;
  --k-cool-light: #f7f9fb;     --k-cool-dark: #0f1215;
  --k-grey-light: #5c5c5c;     --k-grey-dark: #a6a6a6;
  --k-line-light: #d9d9d9;     --k-line-dark: #333333;
  --k-orange-light: #bf5700;   --k-orange-dark: #e8813a;
  --k-red-light: #d70015;      --k-red-dark: #ff6961;

  /* Active canvas tokens: follow the page theme unless the lab pins one. */
  --k-ink: var(--k-ink-light);
  --k-white: var(--k-white-light);
  --k-warm: var(--k-warm-light);
  --k-cool: var(--k-cool-light);
  --k-grey: var(--k-grey-light);
  --k-line: var(--k-line-light);
  --k-orange: var(--k-orange-light);
  --k-red: var(--k-red-light);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --lab-bg: #1a1a1b; --lab-fg: #e7e6e2; --lab-muted: #a3a29c; --lab-line: #3d3d3f; --lab-field: #232325; --lab-focus: #86a8ff; --lab-red: #ff8a80;
    --k-ink: var(--k-ink-dark); --k-white: var(--k-white-dark); --k-warm: var(--k-warm-dark); --k-cool: var(--k-cool-dark);
    --k-grey: var(--k-grey-dark); --k-line: var(--k-line-dark); --k-orange: var(--k-orange-dark); --k-red: var(--k-red-dark);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --lab-bg: #1a1a1b; --lab-fg: #e7e6e2; --lab-muted: #a3a29c; --lab-line: #3d3d3f; --lab-field: #232325; --lab-focus: #86a8ff; --lab-red: #ff8a80;
  --k-ink: var(--k-ink-dark); --k-white: var(--k-white-dark); --k-warm: var(--k-warm-dark); --k-cool: var(--k-cool-dark);
  --k-grey: var(--k-grey-dark); --k-line: var(--k-line-dark); --k-orange: var(--k-orange-dark); --k-red: var(--k-red-dark);
  color-scheme: dark;
}
/* The lab's Light / Dark preview pins the canvas tokens on the stage only. */
.stage[data-scheme="light"] {
  --k-ink: var(--k-ink-light); --k-white: var(--k-white-light); --k-warm: var(--k-warm-light); --k-cool: var(--k-cool-light);
  --k-grey: var(--k-grey-light); --k-line: var(--k-line-light); --k-orange: var(--k-orange-light); --k-red: var(--k-red-light);
  color-scheme: light;
}
.stage[data-scheme="dark"] {
  --k-ink: var(--k-ink-dark); --k-white: var(--k-white-dark); --k-warm: var(--k-warm-dark); --k-cool: var(--k-cool-dark);
  --k-grey: var(--k-grey-dark); --k-line: var(--k-line-dark); --k-orange: var(--k-orange-dark); --k-red: var(--k-red-dark);
  color-scheme: dark;
}

body { background: var(--lab-bg); color: var(--lab-fg); }
*, *::before, *::after { box-sizing: border-box; }

/* ---------- Lab chrome ---------- */
.lab {
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 100%;
}
.lab-head { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 16px; row-gap: 4px; margin-bottom: 14px; }
.lab-head h1 { font-size: 15px; font-weight: 600; margin: 0; }
.lab-head p { margin: 0; color: var(--lab-muted); }
.lab-grid { display: grid; grid-template-columns: minmax(0, 1fr) 272px; gap: 24px; align-items: start; }
@media (max-width: 1040px) { .lab-grid { grid-template-columns: minmax(0, 1fr); } }
.lab-main { min-width: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; }
.lab button, .lab input, .lab textarea, .lab select { font: inherit; color: inherit; }
.lab button { cursor: pointer; }
.tab { border: 1px solid transparent; background: none; padding: 4px 10px; border-radius: 4px; color: var(--lab-muted); }
.tab[aria-pressed="true"] { color: var(--lab-fg); border-color: var(--lab-line); background: var(--lab-field); font-weight: 600; }
.seedbox { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.seedbox label { color: var(--lab-muted); }
#seed { width: 11ch; padding: 3px 6px; border: 1px solid var(--lab-line); border-radius: 4px; background: var(--lab-field); font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--lab-line); background: var(--lab-field); border-radius: 4px; padding: 4px 10px; }
.btn.primary { background: var(--lab-fg); color: var(--lab-bg); border-color: var(--lab-fg); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.caption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; color: var(--lab-muted); margin-bottom: 6px; }
.lab :focus-visible { outline: 2px solid var(--lab-focus); outline-offset: 2px; }

.stage {
  container: stage / inline-size;
  outline: 1px solid var(--lab-line);
  overflow-x: auto;
  cursor: pointer;
  max-width: 100%;
  background: var(--lab-bg);
}
.stage.phone { width: 390px; }
.stage:focus-visible { outline: 2px solid var(--lab-focus); outline-offset: 3px; }

.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; color: var(--lab-muted); }
.row-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.status-line { color: var(--lab-muted); min-height: 1.45em; margin-top: 6px; }
.status-line.bad { color: var(--lab-red); }
.ctls { display: flex; flex-direction: column; gap: 10px; }
.ctl-top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px; }
.ctl-top label, .ctl-top .lbl { min-width: 0; }
.ctl-key { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--lab-muted); margin-left: 4px; }
.ctl output { font-variant-numeric: tabular-nums; color: var(--lab-fg); }
.ctl input[type="range"] { width: 100%; margin: 2px 0 0; accent-color: var(--lab-fg); }
.lock { width: 24px; height: 22px; display: inline-grid; place-items: center; border: 1px solid transparent; background: none; border-radius: 4px; color: var(--lab-muted); padding: 0; }
.lock[aria-pressed="true"] { color: var(--lab-fg); border-color: var(--lab-line); background: var(--lab-field); }
.lock svg { width: 14px; height: 14px; }
.lock .shut { display: none; }
.lock[aria-pressed="true"] .shut { display: inline; }
.lock[aria-pressed="true"] .open { display: none; }
.seg { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg label { padding: 2px 8px; border: 1px solid var(--lab-line); border-radius: 4px; cursor: pointer; color: var(--lab-muted); }
.seg input:checked + label { color: var(--lab-fg); background: var(--lab-field); border-color: var(--lab-fg); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--lab-focus); outline-offset: 1px; }
.check { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.rail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rail li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; align-items: center; }
.rail .apply { text-align: left; border: 1px solid var(--lab-line); background: var(--lab-field); border-radius: 4px; padding: 4px 8px; min-width: 0; }
.rail .apply small { display: block; color: var(--lab-muted); font-size: 12px; overflow-wrap: anywhere; }
.rail .remove { border: none; background: none; color: var(--lab-muted); padding: 4px 6px; }
.empty-note { color: var(--lab-muted); margin: 0; }
.lab textarea { width: 100%; min-height: 9em; resize: vertical; border: 1px solid var(--lab-line); border-radius: 4px; background: var(--lab-field); padding: 6px; font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
#sizes { font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- The canvas: the studio as DESIGN.md draws it ---------- */
.app {
  --ink: var(--k-ink); --grey: var(--k-grey); --line: var(--k-line); --paper: var(--k-white); --acc: var(--k-ink); --red: var(--k-red);
  --gw: 5em; --g1: 1.5em; --g2: 2.5rem;
  --cw: calc(var(--gw) + var(--g1) + var(--measure) + var(--g2) + var(--mw));
  font-family: "Geist", system-ui, sans-serif;
  font-size: var(--ts); line-height: var(--lead); font-weight: 400;
  color: var(--ink); background: var(--paper);
  padding: 22px 32px var(--sec);
  min-width: calc(var(--cw) + 64px);
  text-align: left; font-kerning: normal; font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
.app div, .app span { margin: 0; }
.app.paper-warm { --paper: var(--k-warm); }
.app.paper-cool { --paper: var(--k-cool); }
.app.greys-1 { --line: color-mix(in srgb, var(--k-grey) 35%, transparent); }
.app.accent-orange { --acc: var(--k-orange); }

.app .r { display: grid; grid-template-columns: var(--gw) var(--g1) minmax(0, var(--measure)) var(--g2) var(--mw); align-items: first baseline; max-width: var(--cw); }
.app .g { grid-column: 1; }
.app .m { grid-column: 3; min-width: 0; position: relative; }
.app .n { grid-column: 5; min-width: 0; }
.app .mn { grid-column: 3 / 6; min-width: 0; position: relative; }
.app .stack { display: flex; flex-direction: column; gap: var(--row); }
.app .sec { margin-top: var(--sec); display: flex; flex-direction: column; gap: var(--row); }
.app .sec > .h { border-top: var(--rule) solid var(--line); padding-top: var(--row); }
.app .sub { border-top: var(--rule) solid var(--line); padding-top: var(--row); margin-top: var(--row); }
.app .nav { border-bottom: var(--rule) solid var(--line); padding-bottom: var(--row); }
.app .navl { display: flex; flex-wrap: wrap; column-gap: 1.75em; }
.app .navl .sys { margin-left: auto; color: var(--grey); }
.app .head { margin-top: var(--sec); }
.app .t { font-size: var(--title); line-height: 1.2; font-weight: var(--strong); letter-spacing: -0.018em; text-wrap: balance; }
.app .b { font-weight: var(--strong); }
.app .gr { color: var(--grey); }
.app .own { color: var(--ink); }
.app .red { color: var(--red); }
.app .tn { font-variant-numeric: tabular-nums; }
.app .ref { color: var(--grey); font-variant-numeric: tabular-nums; white-space: nowrap; }
.app .g .ref { display: block; }
.app .key { color: var(--grey); font-variant-numeric: tabular-nums; }
.app .act { color: var(--acc); text-decoration: underline; text-decoration-thickness: max(1px, var(--rule)); text-underline-offset: 0.24em; text-decoration-color: color-mix(in srgb, currentColor 38%, transparent); }
.app .act.b { font-weight: var(--strong); }
.app .focus { font-weight: var(--strong); color: var(--acc); }
.app .old { color: var(--grey); text-decoration: line-through; text-decoration-thickness: 1px; }
.app .acts { display: flex; flex-wrap: wrap; column-gap: 1.5em; }
.app .acts .pair { white-space: nowrap; }
.app .notes { display: flex; flex-direction: column; gap: calc(var(--row) / 2); }
.app .bul::before { content: "•"; position: absolute; left: -0.9em; color: var(--grey); }
.app .indent { padding-left: 1em; }
.app .cnts { display: flex; flex-wrap: wrap; column-gap: 2.5em; row-gap: var(--row); }
.app .cnt .t { font-variant-numeric: tabular-nums; }

/* Ledger: one row per record, aligned columns, tabular figures. */
.app .lg { display: grid; grid-template-columns: var(--cols); column-gap: 1.25em; align-items: first baseline; font-variant-numeric: tabular-nums; }
.app .lg-rec { --cols: minmax(0, 1fr) 9.5em 5.5em 6em minmax(0, 12em); }
.app .lg-act { --cols: minmax(0, 1.35fr) minmax(0, 1.2fr) 6.5em 7.5em 8.5em; }
.app .lg .c { min-width: 0; }
.app .lg.hd { color: var(--grey); }
.app .lg .sub-cell { padding-left: 1em; }
.app .lg .c-full { grid-column: 1 / -1; }
.app .nw { white-space: nowrap; }
.app .parent { padding-bottom: calc(var(--row) / 2); }

/* Under 640px the canvas is one column: sidenotes move under their row, indented. */
@container stage (max-width: 639px) {
  .app { min-width: 0; padding: 16px 20px var(--sec); --gw: 0px; --g1: 0px; }
  .app.refs-gutter { --gw: 4.3em; --g1: 0.7em; }
  .app .r { grid-template-columns: var(--gw) var(--g1) minmax(0, 1fr); max-width: none; }
  .app .n { grid-column: 3; padding-left: 1em; margin-top: calc(var(--row) / 2); }
  .app .mn { grid-column: 3 / 4; }
  .app .nav .mn { grid-column: 1 / -1; }
  .app .navl { column-gap: 1.1em; }
  .app .has-label .n { display: none; }
  .app .lg .c.c-full { display: block; }
  .app .lg { display: block; }
  .app .lg.hd { display: none; }
  .app .lg .c { display: inline; }
  .app .lg .c.c1 { display: block; }
  .app .lg .c.c1 + .c::before { content: none; }
  .app .lg .c:not(.c1):not(.c-full)::before { content: " · "; color: var(--grey); }
  .app .lg .c:empty { display: none; }
  .app .lg .sub-cell { padding-left: 0; }
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">

<div class="lab">
  <div class="lab-head">
    <h1>Studio look lab</h1>
    <p>Click the canvas for a new look. Move a control to change one thing. Save the one you want and send me the JSON.</p>
  </div>
  <div class="lab-grid">
    <div class="lab-main">
      <div class="bar">
        <div class="tabs" id="tabs" role="group" aria-label="Screen"></div>
        <div class="seedbox">
          <label for="seed">Seed</label>
          <input id="seed" type="number" step="1" inputmode="numeric">
          <button class="btn" id="newLook" type="button">New look</button>
          <button class="btn" id="prevLook" type="button" disabled>Previous look</button>
        </div>
      </div>
      <div class="caption">
        <span>Canvas, click for a new look</span>
        <span id="sizes" aria-live="polite"></span>
      </div>
      <div class="stage" id="stage" tabindex="0" role="button" aria-label="Canvas. Press Enter for a new look."></div>
    </div>

    <aside class="panel" aria-label="Look controls">
      <section>
        <div class="row-btns">
          <button class="btn primary" id="save" type="button">Save</button>
          <button class="btn" id="reset" type="button">Reset to defaults</button>
        </div>
        <div class="status-line" id="saveStatus" aria-live="polite"></div>
      </section>
      <section>
        <h2>The look</h2>
        <div class="ctls" id="ctls"></div>
      </section>
      <section>
        <h2>Preview (not saved)</h2>
        <div class="seg" role="radiogroup" aria-label="Canvas theme">
          <input type="radio" name="scheme" id="p-scheme-match" value="match"><label for="p-scheme-match">Match</label>
          <input type="radio" name="scheme" id="p-scheme-light" value="light"><label for="p-scheme-light">Light</label>
          <input type="radio" name="scheme" id="p-scheme-dark" value="dark"><label for="p-scheme-dark">Dark</label>
        </div>
        <div class="seg" role="radiogroup" aria-label="Canvas width">
          <input type="radio" name="width" id="p-width-wide" value="wide"><label for="p-width-wide">Wide</label>
          <input type="radio" name="width" id="p-width-phone" value="phone"><label for="p-width-phone">Phone</label>
        </div>
        <label class="check" for="p-empty"><input type="checkbox" id="p-empty"> Show empty queue</label>
      </section>
      <section>
        <h2>Saved looks</h2>
        <ul class="rail" id="rail"></ul>
        <p class="empty-note" id="railEmpty">None yet. Save puts the look here.</p>
      </section>
      <section>
        <h2><label for="savedJson">Last saved JSON</label></h2>
        <textarea id="savedJson" readonly spellcheck="false" placeholder="Save shows the JSON here."></textarea>
      </section>
      <section>
        <h2><label for="loadJson">Load a look</label></h2>
        <textarea id="loadJson" spellcheck="false" placeholder="Paste a saved look here."></textarea>
        <div class="row-btns" style="margin-top:6px"><button class="btn" id="loadBtn" type="button">Apply</button></div>
        <div class="status-line" id="loadStatus" aria-live="polite"></div>
      </section>
    </aside>
  </div>
</div>

<script>
"use strict";
/* ============ Pure part: data, config, seeded generator, render ============ */

const KEYS = [
  { key: "home", kind: "choice", options: ["queue", "document", "glance"], def: "queue", label: "First screen" },
  { key: "record", kind: "choice", options: ["catalogue", "ledger"], def: "catalogue", label: "Record style" },
  { key: "refs", kind: "choice", options: ["gutter", "inline", "hidden"], def: "gutter", label: "Reference numbers" },
  { key: "textSize", kind: "num", min: 15, max: 18, step: 1, def: 16, unit: "px", label: "Text size" },
  { key: "ratio", kind: "num", min: 1.5, max: 2, step: 0.05, def: 1.75, unit: "×", label: "Title ÷ text" },
  { key: "strong", kind: "num", min: 500, max: 700, step: 100, def: 600, unit: "", label: "Heavy weight" },
  { key: "leading", kind: "num", min: 1.35, max: 1.65, step: 0.05, def: 1.5, unit: "", label: "Line height" },
  { key: "measure", kind: "num", min: 32, max: 44, step: 1, def: 38, unit: "rem", label: "Main column" },
  { key: "margin", kind: "num", min: 12, max: 20, step: 1, def: 16, unit: "rem", label: "Notes column" },
  { key: "rowGap", kind: "num", min: 6, max: 20, step: 1, def: 12, unit: "px", label: "Row gap" },
  { key: "sectionGap", kind: "num", min: 28, max: 72, step: 4, def: 48, unit: "px", label: "Section gap" },
  { key: "ruleWeight", kind: "num", min: 0.5, max: 2, step: 0.25, def: 1, unit: "px", label: "Rule weight" },
  { key: "greys", kind: "choice", options: [1, 2], def: 2, label: "Greys" },
  { key: "paper", kind: "choice", options: ["white", "warm", "cool"], def: "white", label: "Paper" },
  { key: "accent", kind: "choice", options: ["none", "orange"], def: "none", label: "Accent" },
  { key: "notes", kind: "num", min: 0, max: 3, step: 1, def: 2, unit: "", label: "Notes beside a bullet" },
];
const SCREENS = ["home", "record", "job", "resume", "activity"];
const SCREEN_LABEL = { home: "Home", record: "Record", job: "Job", resume: "Resume", activity: "Activity" };

function defaults(screen) {
  const c = {};
  for (const k of KEYS) c[k.key] = k.def;
  c.seed = 0;
  c.screen = screen && SCREENS.includes(screen) ? screen : "home";
  return c;
}

/* mulberry32: the only source of randomness for a look. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function decimals(step) { const s = String(step); return s.includes(".") ? s.split(".")[1].length : 0; }
function snap(k, v) {
  const n = Math.round((v - k.min) / k.step);
  const out = k.min + n * k.step;
  return Number(Math.min(k.max, Math.max(k.min, out)).toFixed(decimals(k.step)));
}
/* Draw a value for every key from the seed (always in KEYS order, so a key's value
   does not depend on which keys are locked), then keep the locked ones. Seed 0 is the default look. */
function variation(base, seed, locks) {
  const out = Object.assign({}, base, { seed: seed });
  const rnd = mulberry32(seed);
  for (const k of KEYS) {
    const u = rnd();
    let v;
    if (seed === 0) v = k.def;
    else if (k.kind === "num") { const steps = Math.round((k.max - k.min) / k.step); v = snap(k, k.min + Math.floor(u * (steps + 1)) * k.step); }
    else v = k.options[Math.floor(u * k.options.length)];
    if (!locks || !locks[k.key]) out[k.key] = v;
  }
  return out;
}
/* Validate pasted JSON: unknown keys ignored, numbers clamped and snapped, bad choices kept as they were. */
function sanitize(input, base) {
  const out = Object.assign({}, base);
  const notes = [];
  if (!input || typeof input !== "object" || Array.isArray(input)) throw new Error("The text is JSON, but not an object with look keys.");
  const known = new Set(KEYS.map(k => k.key).concat(["seed", "screen"]));
  const unknown = Object.keys(input).filter(k => !known.has(k));
  if (unknown.length) notes.push("Ignored " + unknown.length + " unknown key" + (unknown.length > 1 ? "s" : "") + ": " + unknown.join(", ") + ".");
  for (const k of KEYS) {
    if (!(k.key in input)) continue;
    const raw = input[k.key];
    if (k.kind === "num") {
      const n = typeof raw === "number" ? raw : Number(raw);

  const i = n.t.lastIndexOf(" ");
  const head = i > 0 ? n.t.slice(0, i + 1) : "", tail = i > 0 ? n.t.slice(i + 1) : n.t;
  return '<div><span class="own">' + head + '</span><span class="nw"><span class="own">' + tail + '</span> <span class="gr">·</span> ' + statusWord(n.s) + "</span></div>";
}
function resumeDoc(c, master) {
  let out = "";
  if (master) {
    out += '<div class="sec" style="margin-top:var(--sec)">' + row(c, { lines: '<span class="gr">Master resume · revised 14 Nov 2026 · from 13 facts</span>' }) + "</div>";
  }
  out += '<div class="head stack">' + row(c, { lines: '<div class="t">' + PERSON.name + "</div>" }) +
    row(c, { lines: '<span class="gr">' + PERSON.place + " · " + PERSON.email + "</span>" }) +
    row(c, { lines: RESUME.summary }) + "</div>";
  const nn = c.notes;
  let body = "";
  RESUME.roles.forEach((r, ri) => {
    body += row(c, { ref: r.ref, cls: ri ? "sub" : "", lines: ['<span class="b">' + r.title + "</span>", '<span class="gr tn">' + r.dates + "</span>"] });
    for (const b of r.bullets) {
      const text = b.suggestion ? '<span class="old">' + b.old + "</span> " + b.text : b.text;
      const lines = [text];
      if (b.suggestion) lines.push('<div class="acts"><span class="act b">Keep</span><span class="act">Reject</span></div>');
      const notes = b.notes.slice(0, nn);
      body += row(c, { ref: b.ref, mainCls: "bul", lines: lines, note: notes.length ? '<div class="notes">' + notes.map(noteHtml).join("") + "</div>" : "" });
    }
  });
  out += sec(sectionHead(c, "Experience", nn ? '<span class="gr">Notes</span>' : "") + body);
  return out;
}
function resumeScreen(c) {
  const rec = { ref: RESUME.ref, name: RESUME.name, dates: RESUME.dates, extent: RESUME.extent, status: RESUME.status, prov: RESUME.prov, provShort: RESUME.provShort };
  const changes = RESUME.changes.map(ch => row(c, { lines: '<span class="tn"><span class="b">' + ch.rev + '</span> <span class="gr">·</span> ' + ch.date + ' <span class="gr">·</span> <span class="gr">' + ch.text + "</span></span>" })).join("");
  return '<div class="head stack">' + (c.record === "ledger" ? ledgerHead(c) : "") + recordRow(c, rec, { strong: true }) + "</div>" +
    sec(sectionHead(c, "Revisions") + changes) + resumeDoc(c, false);
}
function activityScreen(c) {
  const hd = row(c, { wide: true, lines: '<div class="lg lg-act hd"><span class="c c1">What</span><span class="c">Stage</span><span class="c">Started</span><span class="c">Usually</span><span class="c">Status</span></div>' });
  const rows = ACTIVITY.map(a => {
    const what = a.what;
    const full = a.reason ? '<span class="c c-full"><span class="gr">' + a.reason + '</span> <span class="act b">Try again</span></span>' : "";
    return row(c, { wide: true, lines: '<div class="lg lg-act"><span class="c c1">' + what + '</span><span class="c">' + a.stage + '</span><span class="c">' + a.started +
      '</span><span class="c gr">' + a.usual + '</span><span class="c">' + (a.status === "Running" ? '<span class="own">Running</span>' : statusWord(a.status.split(",")[0]) + (a.status.includes(",") ? '<span class="gr">,' + a.status.split(",")[1] + "</span>" : "")) + "</span>" + full + "</div>" });
  }).join("");
  const dl = '<span class="b">Since you were here</span> <span class="gr">·</span> ' + DIGEST.map(d => d.text.split(".")[0]).join(' <span class="gr">·</span> ');
  return title(c, "Activity") + '<div class="sec">' + row(c, { lines: dl, wide: true }) + "</div>" + sec(hd.replace('class="r"', 'class="r h"') + rows);
}

/* render(config, preview) → the canvas content. Pure: same input, same output. */
function render(c, p) {
  p = p || {};
  const titlePx = Math.round(c.textSize * c.ratio * 100) / 100;
  const cls = ["app", "paper-" + c.paper, "greys-" + c.greys, "accent-" + c.accent, "refs-" + c.refs, "rec-" + c.record, "scr-" + c.screen].join(" ");
  /* DESIGN.md gives sizes in px; Exact writes them in rem (px ÷ 16) so the browser text size still applies. Rules stay in px. */
  const rem = px => Math.round(px / 16 * 10000) / 10000 + "rem";
  const style = "--ts:" + rem(c.textSize) + ";--title:" + rem(titlePx) + ";--strong:" + c.strong + ";--lead:" + c.leading + ";--measure:" + c.measure + "rem;--mw:" + c.margin +
    "rem;--row:" + rem(c.rowGap) + ";--sec:" + rem(c.sectionGap) + ";--rule:" + c.ruleWeight + "px";
  let body;
  if (c.screen === "home") body = c.home === "document" ? homeDocument(c, p) : c.home === "glance" ? homeGlance(c, p) : homeQueue(c, p);
  else if (c.screen === "record") body = recordScreen(c);
  else if (c.screen === "job") body = jobScreen(c);
  else if (c.screen === "resume") body = resumeScreen(c);
  else body = activityScreen(c);
  return '<div class="' + cls + '" style="' + style + '">' + nav(c) + body + "</div>";
}

/* Collect the font sizes of every text node (and generated text) in the canvas. */
function canvasFontSizes(root) {
  const set = new Set();
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) { if (n.nodeValue.trim()) set.add(getComputedStyle(n.parentElement).fontSize); }
  root.querySelectorAll("*").forEach(el => {
    for (const ps of ["::before", "::after"]) {
      const cs = getComputedStyle(el, ps);
      if (cs.content && cs.content !== "none" && cs.content !== "normal") set.add(cs.fontSize);
    }
  });
  return Array.from(set).sort((a, b) => parseFloat(a) - parseFloat(b));
}

/* ============ Lab UI ============ */
function boot() {
  const $ = id => document.getElementById(id);
  const STORE = "studio-look-lab.saved.v1";
  const state = { config: defaults("home"), locks: {}, scheme: "match", width: "wide", empty: false, history: [] };

  function load() { try { const v = JSON.parse(localStorage.getItem(STORE) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function store(list) { try { localStorage.setItem(STORE, JSON.stringify(list)); } catch (e) { /* storage blocked: the rail lives for this visit only */ } }
  let saved = load();

  function newSeed() {
    let s = 0;
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); s = a[0] % 2147483647; } catch (e) { s = Date.now() % 2147483647; }
    return s || 1;
  }

  /* Tabs */
  const tabs = $("tabs");
  SCREENS.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.id = "tab-" + s; b.textContent = SCREEN_LABEL[s];
    b.addEventListener("click", () => { apply(Object.assign({}, state.config, { screen: s }), false); });
    tabs.appendChild(b);
  });

  /* Controls */
  const ctls = $("ctls");
  const lockSvg = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="7" width="10" height="7" rx="1"/><path class="shut" d="M5 7V5a3 3 0 0 1 6 0v2"/><path class="open" d="M5 7V5a3 3 0 0 1 5.8-1"/></svg>';
  for (const k of KEYS) {
    const wrap = document.createElement("div");
    wrap.className = "ctl"; wrap.id = "row-" + k.key;
    if (k.kind === "num") {
      wrap.innerHTML = '<div class="ctl-top"><label for="c-' + k.key + '">' + k.label + '<span class="ctl-key">' + k.key + "</span></label>" +
        '<output id="v-' + k.key + '" for="c-' + k.key + '"></output>' +
        '<button type="button" class="lock" id="l-' + k.key + '" aria-pressed="false" aria-label="Lock ' + k.key + '" title="Lock: a new look keeps this value">' + lockSvg + "</button></div>" +
        '<input type="range" id="c-' + k.key + '" min="' + k.min + '" max="' + k.max + '" step="' + k.step + '">';
      wrap.querySelector("input").addEventListener("input", e => {
        const v = snap(k, Number(e.target.value));
        apply(Object.assign({}, state.config, { [k.key]: v }), false, true);
      });
    } else {
      const radios = k.options.map(o => '<input type="radio" name="c-' + k.key + '" id="c-' + k.key + "-" + o + '" value="' + o + '"><label for="c-' + k.key + "-" + o + '">' + o + "</label>").join("");
      wrap.innerHTML = '<div class="ctl-top"><span class="lbl" id="lbl-' + k.key + '">' + k.label + '<span class="ctl-key">' + k.key + "</span></span><span></span>" +
        '<button type="button" class="lock" id="l-' + k.key + '" aria-pressed="false" aria-label="Lock ' + k.key + '" title="Lock: a new look keeps this value">' + lockSvg + "</button></div>" +
        '<div class="seg" role="radiogroup" aria-labelledby="lbl-' + k.key + '">' + radios + "</div>";
      wrap.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => {
        const v = k.options.find(o => String(o) === inp.value);
        apply(Object.assign({}, state.config, { [k.key]: v }), false, true);
      }));
    }
    wrap.querySelector(".lock").addEventListener("click", e => {
      state.locks[k.key] = !state.locks[k.key];
      e.currentTarget.setAttribute("aria-pressed", String(!!state.locks[k.key]));
    });
    ctls.appendChild(wrap);
  }

  function syncControls() {
    const c = state.config;
    for (const k of KEYS) {
      if (k.kind === "num") {
        $("c-" + k.key).value = c[k.key];
        $("v-" + k.key).textContent = (k.key === "ratio" ? c[k.key].toFixed(2) : String(c[k.key])) + (k.unit && k.unit !== "×" ? " " + k.unit : "");
      } else {
        const r = $("c-" + k.key + "-" + c[k.key]); if (r) r.checked = true;
      }
    }
    if (document.activeElement !== $("seed")) $("seed").value = c.seed;
    SCREENS.forEach(s => $("tab-" + s).setAttribute("aria-pressed", String(s === c.screen)));
    $("p-scheme-" + state.scheme).checked = true;
    $("p-width-" + state.width).checked = true;
    $("p-empty").checked = state.empty;
    $("prevLook").disabled = state.history.length === 0;
  }

  const stage = $("stage");
  function draw() {
    stage.dataset.scheme = state.scheme === "match" ? "" : state.scheme;
    if (state.scheme === "match") stage.removeAttribute("data-scheme");
    stage.classList.toggle("phone", state.width === "phone");
    stage.innerHTML = render(state.config, { empty: state.empty });
    const sizes = canvasFontSizes(stage);
    const ok = sizes.length <= 2;
    const app = stage.firstElementChild;
    const wider = app && app.scrollWidth > stage.clientWidth + 1;
    $("sizes").textContent = (wider ? "Wider than this window: scroll the canvas sideways. " : "") + "Type sizes on this screen: " + sizes.join(" and ") + (ok ? "" : " (more than two, a defect)");
    $("sizes").style.color = ok ? "" : "var(--lab-red)";
    if (!ok) console.error("Canvas has more than two type sizes:", sizes);
  }
  function writeHash() {
    const parts = [state.config.screen];
    if (state.scheme !== "match") parts.push(state.scheme);
    if (state.width === "phone") parts.push("phone");
    if (state.empty) parts.push("empty");
    try { history.replaceState(null, "", "#" + parts.join("-")); } catch (e) { /* the host may refuse; the page still works */ }
  }
  function apply(next, pushHistory, fromControl) {
    if (pushHistory) { state.history.push(state.config); if (state.history.length > 50) state.history.shift(); }
    state.config = next;
    syncControls(); draw(); writeHash();
  }
  function readHash() {
    const parts = (location.hash || "").slice(1).toLowerCase().split("-").filter(Boolean);
    const screen = parts.find(p => SCREENS.includes(p));
    state.scheme = parts.includes("dark") ? "dark" : parts.includes("light") ? "light" : "match";
    state.width = parts.includes("phone") ? "phone" : "wide";
    state.empty = parts.includes("empty");
    if (screen) state.config = Object.assign({}, state.config, { screen: screen });
  }

  function newLook() { apply(variation(state.config, newSeed(), state.locks), true); }
  stage.addEventListener("click", newLook);
  stage.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); newLook(); } });
  $("newLook").addEventListener("click", newLook);
  $("prevLook").addEventListener("click", () => {
    const prev = state.history.pop();
    if (prev) apply(Object.assign({}, prev, { screen: state.config.screen }), false);
  });
  $("seed").addEventListener("change", e => {
    const s = Math.trunc(Number(e.target.value));
    if (!Number.isFinite(s)) { e.target.value = state.config.seed; return; }
    apply(variation(state.config, s, state.locks), true);
  });
  $("reset").addEventListener("click", () => apply(defaults(state.config.screen), true));

  document.querySelectorAll('input[name="scheme"]').forEach(i => i.addEventListener("change", () => { state.scheme = i.value; draw(); writeHash(); }));
  document.querySelectorAll('input[name="width"]').forEach(i => i.addEventListener("change", () => { state.width = i.value; draw(); writeHash(); }));
  $("p-empty").addEventListener("change", e => { state.empty = e.target.checked; draw(); writeHash(); });

  /* Save */
  function summary(c) {
    const t = Math.round(c.textSize * c.ratio * 100) / 100;
    return c.textSize + "/" + t + " px · " + c.strong + " · " + c.paper + " · " + c.record + " · " + c.refs + (c.accent !== "none" ? " · " + c.accent : "") + " · seed " + c.seed;
  }
  function drawRail() {
    const rail = $("rail");
    rail.innerHTML = "";
    $("railEmpty").hidden = saved.length > 0;
    saved.forEach((c, i) => {
      const li = document.createElement("li");
      const a = document.createElement("button");
      a.type = "button"; a.className = "apply"; a.id = "saved-" + i;
      a.innerHTML = "Look " + (i + 1) + "<small>" + summary(c) + "</small>";
      a.addEventListener("click", () => {
        const res = sanitize(c, state.config);
        apply(Object.assign(res.config, { screen: state.config.screen }), true);
        $("savedJson").value = JSON.stringify(ordered(state.config), null, 2);
      });
      const rm = document.createElement("button");
      rm.type = "button"; rm.className = "remove"; rm.id = "remove-" + i; rm.textContent = "Remove";
      rm.setAttribute("aria-label", "Remove look " + (i + 1));
      rm.addEventListener("click", () => { saved.splice(i, 1); store(saved); drawRail(); });
      li.appendChild(a); li.appendChild(rm); rail.appendChild(li);
    });
  }
  $("save").addEventListener("click", () => {
    const json = JSON.stringify(ordered(state.config), null, 2);
    const box = $("savedJson");
    box.value = json;
    const last = saved[saved.length - 1];
    if (!last || JSON.stringify(ordered(last)) !== JSON.stringify(ordered(state.config))) { saved.push(ordered(state.config)); store(saved); drawRail(); }
    const st = $("saveStatus");
    st.className = "status-line";
    const fallback = () => { box.focus(); box.select(); st.textContent = "Copy was blocked. The JSON is selected below: press Cmd+C or Ctrl+C."; };
    try {
      navigator.clipboard.writeText(json).then(() => { st.textContent = "Saved and copied. Send me the JSON."; }, fallback);
    } catch (e) { fallback(); }
  });

  /* Load */
  $("loadBtn").addEventListener("click", () => {
    const st = $("loadStatus");
    let obj;
    try { obj = JSON.parse($("loadJson").value); }
    catch (e) { st.className = "status-line bad"; st.textContent = "This is not valid JSON. Paste the whole object, from { to }."; return; }
    try {
      const res = sanitize(obj, state.config);
      apply(res.config, true);
      st.className = "status-line";
      st.textContent = "Applied." + (res.notes.length ? " " + res.notes.join(" ") : "");
    } catch (e) { st.className = "status-line bad"; st.textContent = e.message; }
  });

  window.addEventListener("hashchange", () => { readHash(); syncControls(); draw(); });
  readHash();
  syncControls();
  drawRail();
  draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());
  window.__lab = { render, variation, sanitize, defaults, ordered, KEYS, SCREENS, canvasFontSizes, state, apply, draw };
}
if (typeof document !== "undefined") boot();
</script>
