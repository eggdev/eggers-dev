# Git hooks. Kept deliberately small: format/lint staged files on commit,
# typecheck before push. Nothing that slows the loop without earning it.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,mjs,ts,tsx,json,jsonc,css}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: bun run check
